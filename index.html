
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006d69">
  <title>大津線 記録管理</title>
  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>

<body>
  <header class="top">
    <div>
      <p class="eyebrow">OTSU LINE</p>
      <h1>記録管理</h1>
    </div>
    <span id="roleBadge" class="badge">未ログイン</span>
  </header>

  <main>
    <!-- ログイン画面 -->
    <section id="loginPanel" class="panel">
      <h2>ログイン</h2>
      <p class="muted">
        Googleアカウントでログインしてください。
      </p>
      <button id="googleLoginBtn">Googleでログイン</button>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>

    <!-- 承認待ち画面 -->
    <section id="pendingPanel" class="panel" hidden>
      <h2>承認待ち</h2>
      <p>アカウント登録が完了しました。</p>
      <p>現在、管理者による承認待ちです。</p>
      <p>承認されると記録一覧を閲覧できるようになります。</p>
      <button id="pendingLogoutBtn" class="secondary">ログアウト</button>
    </section>

    <!-- アカウント停止画面 -->
    <section id="disabledPanel" class="panel" hidden>
      <h2>利用停止中</h2>
      <p>このアカウントは現在利用停止されています。</p>
      <p>管理者にお問い合わせください。</p>
      <button id="disabledLogoutBtn" class="secondary">ログアウト</button>
    </section>

    <!-- アプリ本体 -->
    <section id="appPanel" hidden>

      <div class="toolbar">
        <!-- 現在地・最寄り駅 -->
<section id="locationPanel" class="panel">
  <h3>現在地・最寄り駅</h3>
  <p class="muted">
    現在地から大津線の最寄り駅を調べます。
    位置情報は記録・保存されません。
  </p>
  <button id="locationBtn" type="button">
    現在地から最寄り駅を調べる
  </button>
  <p id="locationMessage" class="message" aria-live="polite"></p>
</section>
        <div>
          <h2>記録一覧</h2>
          <p class="muted" id="userEmail"></p>
        </div>
        <button id="logoutBtn" class="secondary">ログアウト</button>
      </div>

      <!-- 管理者用：記録追加 -->
      <section id="adminForm" class="panel" hidden>
        <h3>記録を追加</h3>


        
        <label>
          記録名
          <input id="recordTitle" maxlength="120"
            placeholder="例：資料名・管理番号">
        </label>

        <label>
          分類
          <input id="recordCategory" maxlength="80"
            placeholder="例：石山坂本線／京津線">
        </label>

        <label>
          メモ
          <textarea id="recordNote" rows="3" maxlength="1000"></textarea>
        </label>

        <button id="addBtn">追加する</button>
        <p id="adminMessage" class="message" aria-live="polite"></p>
      </section>

      <!-- 管理者用：ユーザー管理 -->
      <section id="userManagement" class="panel" hidden>
        <h3>ユーザー管理</h3>
        <p class="muted">
          新規ユーザーの承認や利用停止を管理できます。
        </p>
        <button id="refreshUsersBtn" class="secondary">
          ユーザー一覧を更新
        </button>
        <div id="users" class="records"></div>
        <p id="userMessage" class="message" aria-live="polite"></p>
      </section>

      <!-- 記録一覧 -->
      <div class="filters">
        <label class="check">
          <input id="uncollectedOnly" type="checkbox" checked>
          未完了のみ表示
        </label>
        <button id="refreshBtn" class="secondary">再読み込み</button>
      </div>

      <div id="records" class="records"></div>
      <p id="listMessage" class="message" aria-live="polite"></p>

    </section>
  </main>

  <footer>
    記録は共有データベースに保存されます。
  </footer>
</body>
</html>
