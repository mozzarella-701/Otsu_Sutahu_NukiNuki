<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#006d69">
  <title>大津線 記録管理</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">OTSU LINE</p>
      <h1>記録管理</h1>
    </div>
    <span id="roleBadge" class="badge">未ログイン</span>
  </header>

  <main>
    <section id="loginPanel" class="panel">
      <h2>ログイン</h2>
      <p class="muted">発行されたアカウントでログインしてください。</p>
      <label>メールアドレス<input id="email" type="email" autocomplete="username"></label>
      <label>パスワード<input id="password" type="password" autocomplete="current-password"></label>
      <button id="loginBtn">ログイン</button>
      <p id="loginMessage" class="message" aria-live="polite"></p>
    </section>

    <section id="appPanel" hidden>
      <div class="toolbar">
        <div>
          <h2>記録一覧</h2>
          <p class="muted">登録済みの記録を確認できます。</p>
        </div>
        <button id="logoutBtn" class="secondary">ログアウト</button>
      </div>

      <section id="adminForm" class="panel" hidden>
        <h3>記録を追加</h3>
        <label>記録名<input id="recordTitle" maxlength="120" placeholder="例：資料名・管理番号"></label>
        <label>分類<input id="recordCategory" maxlength="80" placeholder="例：石山坂本線／京津線 など"></label>
        <label>メモ<textarea id="recordNote" rows="3" maxlength="1000"></textarea></label>
        <button id="addBtn">追加する</button>
        <p id="adminMessage" class="message" aria-live="polite"></p>
      </section>

      <div class="filters">
        <label class="check"><input id="uncollectedOnly" type="checkbox" checked> 未完了のみ表示</label>
        <button id="refreshBtn" class="secondary">再読み込み</button>
      </div>
      <div id="records" class="records"></div>
      <p id="listMessage" class="message" aria-live="polite"></p>
    </section>
  </main>
  <footer>記録は共有データベースに保存されます。</footer>
</body>
</html>
